<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>SpinPulse VIP — Онлайн Слоты, Краш-игры и Джекпоты</title>
    <meta
      name="description"
      content="SpinPulse — премиальное лобби лицензионных демо-слотов, краш-игр и прогрессивных джекпотов. Играйте в Gates of Olympus, Sweet Bonanza, Aviator бесплатно без регистрации."
    />
    <meta name="keywords" content="spinpulse, слоты онлайн, демо игры, gates of olympus, краш игры, джекпот, pragmatic play, казино лобби" />
    <meta name="theme-color" content="#d97706" />
    <link rel="canonical" href="https://lelyaler.github.io/SpinPulse/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lelyaler.github.io/SpinPulse/" />
    <meta property="og:title" content="SpinPulse VIP — Онлайн Слоты и Джекпоты" />
    <meta property="og:description" content="Премиальное игровое лобби слотов, краш-игр и live-столов с демо-балансом и моментальными раундами." />
    <meta property="og:image" content="./banners/banner-zeus-bright.webp" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://lelyaler.github.io/SpinPulse/" />
    <meta property="twitter:title" content="SpinPulse VIP — Онлайн Слоты и Джекпоты" />
    <meta property="twitter:description" content="Премиальное лобби демо-слотов и краш-игр." />
    <meta property="twitter:image" content="./banners/banner-zeus-bright.webp" />

    <link rel="preload" as="image" href="./banners/banner-zeus-bright.webp" type="image/webp" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-amber-300 selection:text-amber-950">
    <div id="root">
      <div style="min-height:100vh;background:#f8fafc;color:#0f172a;font-family:'Plus Jakarta Sans',sans-serif;">
        <header style="height:72px;background:#ffffff;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;padding:0 20px;justify-content:space-between;position:sticky;top:0;z-index:30;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:40px;height:40px;border-radius:14px;background:#0f172a;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;">👑</div>
            <div>
              <div style="font-size:18px;font-weight:900;letter-spacing:-0.5px;color:#0f172a;">Spin<span style="color:#f59e0b;">Pulse</span></div>
              <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.5px;">VIP LOUNGE</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;background:#f1f5f9;border-radius:12px;padding:8px 16px;color:#0f172a;font-weight:800;font-size:14px;">
            $2,500.00
          </div>
        </header>

        <main style="max-width:1280px;margin:0 auto;padding:24px 16px;width:100%;">
          <div style="position:relative;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px -10px rgba(0,0,0,0.15);background:#020617;color:#fff;min-height:420px;display:flex;align-items:center;">
            <img
              src="./banners/banner-zeus-bright.webp"
              alt="GATES OF OLYMPUS 1000"
              fetchpriority="high"
              decoding="async"
              style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;"
            />
            <div style="position:absolute;inset:0;background:linear-gradient(to right,rgba(2,6,23,0.7),transparent);pointer-events:none;"></div>
            <div style="position:relative;z-index:10;margin:24px;max-width:540px;padding:24px;border-radius:20px;background:rgba(2,6,23,0.55);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.1);">
              <div style="display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:9999px;background:rgba(255,255,255,0.1);font-size:11px;font-weight:800;letter-spacing:0.5px;color:#fde68a;margin-bottom:12px;">
                <span>🔥 HOT GAME</span>
                <span style="padding:2px 8px;border-radius:9999px;background:#f59e0b;color:#020617;font-size:10px;font-weight:900;">15,000x</span>
              </div>
              <h1 style="font-size:28px;font-weight:900;letter-spacing:-0.5px;color:#fff;margin:0 0 10px 0;line-height:1.2;">GATES OF OLYMPUS 1000</h1>
              <p style="font-size:13px;color:#e2e8f0;font-weight:500;line-height:1.5;margin:0 0 20px 0;">Молнии Зевса с множителями до 1,000x и макс-вин 15,000x. Демо-раунды без регистрации.</p>
              <div style="display:inline-flex;align-items:center;padding:12px 24px;border-radius:14px;background:#f59e0b;color:#020617;font-weight:900;font-size:13px;">
                ИГРАТЬ
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
